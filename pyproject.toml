[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fhcontent"
version = "0.1.0"
description = "Handoff-aware content delivery: a streaming client and an edge server driven by driver handoff events"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paolo Gallo" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fhcontent-compare = "fhcontent.compare:main"

[tool.setuptools.packages.find]
where = ["content"]

[tool.pytest.ini_options]
testpaths = ["content/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["fhcontent", "conftest"]
